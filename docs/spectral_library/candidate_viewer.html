const map = L.map('map', {zoomControl:true, maxZoom:21});
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxNativeZoom:19, maxZoom:21, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'}).addTo(map);
const legend = L.control({position:'bottomleft'});
legend.onAdd = () => { const d = L.DomUtil.create('div','legend');
  d.innerHTML = '<span style="color:#ff2d2d">&#9632;</span> 30 m EnMAP pixel (the square you judge)<br>'+
  '<span style="color:#ffd400">&#9633;</span> &plusmn;15 m margin (EnMAP position can be off by up to half a pixel)<br>'+
  'Imagery: Esri. Use "Open in Google Maps" to compare dates.'; return d; };
legend.addTo(map);
let i = 0, layers = [];
const sel = document.getElementById('jump');
P.forEach((p,k) => { const o = document.createElement('option'); o.value = k; o.textContent = '#'+p.n+' '+p.m; sel.appendChild(o); });
function sq(lat, lon, half) {
  const dlat = half / 111320, dlon = half / (111320 * Math.cos(lat * Math.PI / 180));
  return [[lat-dlat, lon-dlon], [lat+dlat, lon+dlon]];
}
function show(k) {
  i = (k + P.length) % P.length; const p = P[i];
  layers.forEach(l => map.removeLayer(l)); layers = [];
  layers.push(L.rectangle(sq(p.lat,p.lon,15), {color:'#ff2d2d', weight:3, fill:false}).addTo(map));
  layers.push(L.circleMarker([p.lat,p.lon], {radius:3, color:'#ff2d2d', fillOpacity:1}).addTo(map));
  if (document.getElementById('margin').checked)
    layers.push(L.rectangle(sq(p.lat,p.lon,30), {color:'#ffd400', weight:2, dashArray:'6 6', fill:false}).addTo(map));
  map.setView([p.lat,p.lon], 19);
  document.getElementById('title').textContent = '#'+p.n+' · Proposed: '+p.m;
  document.getElementById('gmaps').href = 'https://www.google.com/maps/@'+p.lat+','+p.lon+',60m/data=!3m1!1e3';
  document.getElementById('gframe').src = 'https://maps.google.com/maps?q='+p.lat+','+p.lon+'&t=k&z=19&output=embed';
  const ed = document.getElementById('edate'); ed.textContent = 'Esri image date: ...';
  const u = 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/identify?geometry='+p.lon+','+p.lat+

    '&imageDisplay=800,600,96&returnGeometry=false&f=json';
  const want = p.n;
  fetch(u).then(r=>r.json()).then(d=>{ if (P[i].n!==want) return;
    const a = (d.results||[]).find(x=>x.layerId===0); const dt = a && a.attributes['DATE (YYYYMMDD)'];
    ed.textContent = dt ? 'Esri image date: '+dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8) : 'Esri image date: unknown';
  }).catch(()=>{ ed.textContent = 'Esri image date: unavailable'; });
  sel.value = i; history.replaceState(null,'','#'+p.n);
}
document.getElementById('prev').onclick = () => show(i-1);
document.getElementById('next').onclick = () => show(i+1);
sel.onchange = () => show(+sel.value);
document.getElementById('margin').onchange = () => show(i);
document.addEventListener('keydown', e => { if (e.target.tagName==='SELECT') return;
  if (e.key==='ArrowRight') show(i+1); if (e.key==='ArrowLeft') show(i-1); });
const h = parseInt(location.hash.slice(1)); show(h ? P.findIndex(p=>p.n===h) : 0);
