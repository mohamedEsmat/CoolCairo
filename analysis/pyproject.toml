[project]
name = "coolcairo"
version = "0.1.0"
description = "Block-level urban heat analysis for one Cairo district"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.6",
    "rioxarray>=0.17",
    "rasterio>=1.4",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3.10",
    "odc-geo>=0.4",
    "scikit-learn>=1.5",
    "osmnx>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coolcairo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"notebooks/*" = ["ANN", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
