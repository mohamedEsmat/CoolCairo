# Single source of truth for geography, dates and thresholds.
# Every script reads this file via coolcairo.config.load_config(); nothing is hardcoded elsewhere.

# Projected CRS for all analysis: WGS 84 / UTM zone 36N (Cairo sits at ~31.2 E).
crs: "EPSG:32636"

# Analysis pixel size (m). Landsat and EnMAP are native 30 m; Sentinel-2 is resampled onto this grid.
pixel_size: 30
# Block size (m). 90 m = 3x3 analysis pixels, close to Landsat's 100 m native thermal resolution.
# Blocks are the unit of every number shown to the user.
block_size: 90

# Display district: what the Unity app renders. Kept small for WebGL (target < ~3000 buildings).
# Nasr City, ~2 x 2 km around Abbas El Akkad / International Garden. Verify on a basemap before M1.
display_aoi:
  name: "Nasr City"
  bbox_wgs84: [31.325, 30.050, 31.346, 30.068]  # [min_lon, min_lat, max_lon, max_lat]

# Model area: larger area used only to fit the regression, so the model sees thousands of
# blocks with real variation in materials and vegetation (east Cairo: Heliopolis, Nasr City, Abbassia).
model_aoi:
  bbox_wgs84: [31.26, 30.00, 31.40, 30.12]

# Only blocks that are actually urban are used to fit the model (drops open desert).
min_building_coverage: 0.10

# Scene selection: summer daytime, several years, median composite (more robust than one scene).
dates:
  years: [2023, 2024, 2025]
  months: [6, 7, 8]
max_cloud_cover: 10

# Spatial cross-validation tile size (m). Blocks inside the same tile never straddle train/test.
cv_tile_size: 1000
cv_folds: 5

# Interim Sentinel-2 classification thresholds (replaced by EnMAP classes when data arrives).
# Classes: vegetation, dark (asphalt, dark roofs), bright (light concrete, pale roofs), soil.
s2_classification:
  ndvi_vegetation: 0.30
  # Mean visible reflectance (B02, B03, B04) separating dark from bright surfaces.
  brightness_dark_max: 0.14
  # Bare Soil Index above which a bright pixel is soil. Chosen as the best single threshold
  # (75% balanced accuracy) between pixels inside OSM footprints and open ground > 300 m from
  # any footprint, over the model area, 2023-2025 summer composite (analysis 23 Sep 2026).
  bsi_soil_min: 0.137

# Cool-roof effect. "literature" (default) or "regression" (use -coef(dark_roof_frac) once the
# fitted coefficient is physically plausible, e.g. after EnMAP classification).
# Interim Sentinel-2 data gives a negative dark-roof coefficient (dark roofs look cooler, likely
# building shadow), so the fitted value cannot be used; see CLAUDE.md fallbacks.
cool_roof:
  method: literature
  # Roof surface temperature change per unit roof albedo increase (K). Wang, Huang & Li (2020),
  # "Where Are White Roofs More Effective in Cooling the Surface?", Geophysical Research Letters
  # 47, e2020GL087853: JJA daily-mean values mostly -8 to -4 K, with the Arabian Peninsula and
  # Mediterranean among the most sensitive regions. -8 K is the top of that range. It is a daily
  # mean, so it is conservative for Landsat's ~10:30 daytime overpass.
  dts_per_albedo: -8.0
  # Dark roof / pavement baseline albedo, as used for Cairo in "The impact of increasing urban
  # surface albedo on outdoor air and surface temperatures during summer in newly developed
  # areas", Scientific Reports (2025), doi:10.1038/s41598-025-08574-2 (0.12 -> 0.50 pavement
  # gave up to 12.94 C lower surface temperature at peak sun: an upper-bound cross-check).
  # Within the weathered-asphalt range 0.10-0.15 of the ACPA table below.
  albedo_dark_roof: 0.12
  # Pale (weathered gray concrete) roof albedo: midpoint of 0.20-0.30 for weathered gray
  # portland cement concrete, American Concrete Pavement Association, "Albedo: A Measure of
  # Pavement Surface Reflectance", R&T Update 3.05 (2002), Table 1 (field measurements).
  albedo_pale_roof: 0.25
  # Cool-roof albedo of Wang et al. (2020) Case 4.
  albedo_after: 0.70
  # "regression" only replaces the dark-roof term; pale roofs are the model's reference
  # category, so their effect always comes from the literature values above.

# Building heights: OSM `height` -> OSM `building:levels` x storey height
#   -> Google Open Buildings 2.5D Temporal 2023 (median inside footprint) -> default.
storey_height_m: 3.2
default_levels: 5
# Minimum Open Buildings pixels (4 m) with height inside a footprint to trust its median.
open_buildings_min_pixels: 3

# Heat risk = heat exposure = residents x degrees C above a reference surface temperature.
worldpop:
  # WorldPop Global2 R2025A, 100 m, constrained, 2024 (middle of the LST period). CC BY 4.0.
  url: "https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/2024/EGY/v1/100m/constrained/egy_pop_2024_CN_100m_R2025A_v1.tif"
# Reference: median summer LST of the urban training blocks in the model area, i.e. heat
# exposure counts only degrees above what is typical for built-up east Cairo.
heat_reference: urban_median
